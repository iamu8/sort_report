!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <title>合併排序法</title>
</head>
<body>
    <h1>合併排序法示範</h1>
    <p>輸入一個陣列（以逗號分隔）：</p>
    <input type="text" id="arrayInput" placeholder="例如: 5,3,8,4,2">
    <button onclick="mergeSortDemo()">排序</button>
    <p id="result"></p>

    <script>
        function merge(left, right) {
            let result = [];
            let i = 0, j = 0;
            
            while (i < left.length && j < right.length) {
                if (left[i] < right[j]) {
                    result.push(left[i]);
                    i++;
                } else {
                    result.push(right[j]);
                    j++;
                }
            }
            
            return result.concat(left.slice(i)).concat(right.slice(j));
        }
        
        function mergeSort(arr) {
            if (arr.length <= 1) {
                return arr;
            }
            
            let mid = Math.floor(arr.length / 2);
            let left = mergeSort(arr.slice(0, mid));
            let right = mergeSort(arr.slice(mid));
            
            return merge(left, right);
        }
        
        function mergeSortDemo() {
            let input = document.getElementById('arrayInput').value;
            let arr = input.split(',').map(Number);
            let sortedArr = mergeSort(arr);
            document.getElementById('result').innerText = '排序後的陣列: ' + sortedArr.join(', ');
        }
    </script>
</body>
</html>
