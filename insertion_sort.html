!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <title>插入排序法</title>
</head>
<body>
    <h1>插入排序法示範</h1>
    <p>輸入一個陣列（以逗號分隔）：</p>
    <input type="text" id="arrayInput" placeholder="例如: 5,3,8,4,2">
    <button onclick="insertionSort()">排序</button>
    <p id="result"></p>

    <script>
        function insertionSort() {
            let input = document.getElementById('arrayInput').value;
            let arr = input.split(',').map(Number);
            let n = arr.length;
            
            for (let i = 1; i < n; i++) {
                let key = arr[i];
                let j = i - 1;
                
                while (j >= 0 && arr[j] > key) {
                    arr[j + 1] = arr[j];
                    j = j - 1;
                }
                arr[j + 1] = key;
            }
            
            document.getElementById('result').innerText = '排序後的陣列: ' + arr.join(', ');
        }
    </script>
</body>
</html>
